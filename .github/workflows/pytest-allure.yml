name: Tests with Allure Report

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pytest allure-pytest allure-combine

    - name: Run tests with Allure
      run: pytest test_hello.py --alluredir=allure-results -v
      continue-on-error: true

    - name: Generate Allure HTML Report
      if: always()
      run: allure-combine allure-results --dest allure-report.html --auto-create-folders

    - name: Upload Allure Report as Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report.html
        retention-days: 30