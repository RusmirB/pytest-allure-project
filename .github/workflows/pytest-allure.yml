name: Tests with Allure Report

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest allure-pytest

    - name: Run tests with Allure
      run: pytest test_hello.py --alluredir=allure-results -v
      continue-on-error: true

    - name: Install Java (required for Allure CLI)
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jre-headless

    - name: Download and Install Allure CLI
      run: |
        wget https://github.com/allure-framework/allure2/releases/download/2.21.0/allure-2.21.0.zip
        unzip allure-2.21.0.zip
        export PATH=$PATH:$(pwd)/allure-2.21.0/bin

    - name: Generate Allure Report
      if: always()
      run: |
        export PATH=$PATH:$(pwd)/allure-2.21.0/bin
        allure generate allure-results --clean -o allure-report

    - name: Upload Allure Report as Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30